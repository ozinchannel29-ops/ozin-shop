# Jean Shop – konfigurasi Cloudflare Worker (opsional; untuk Digiflazz pakai VPS: server/node.mjs)
name = "ozin-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./docs"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ozin-shop"
database_id = "00000000-0000-0000-0000-000000000000" # diganti saat deploy (wrangler d1 create ozin-shop)
migrations_dir = "migrations"

[vars]
# Untung per produk: harga jual = modal + max(modal × MARGIN_PERCENT%, MARGIN_MIN), dibulatkan ke atas per ROUND_TO
MARGIN_PERCENT = "5"
MARGIN_MIN = "500"
ROUND_TO = "100"
# Level harga modal di VIPayment: basic | premium | special
VIP_LEVEL = "basic"
# sandbox | production
TRIPAY_MODE = "sandbox"
# Email pelanggan default untuk Tripay (wajib di API Tripay)
CUSTOMER_EMAIL = "ihsanyahya08@gmail.com"
# IP server callback VIPayment (dari dokumentasi mereka)
VIP_CALLBACK_IP = "178.248.73.218"

# Rahasia & pilihan supplier TIDAK ditaruh di sini: lihat .dev.vars.example
# (komputer: .dev.vars | VPS: .env | Cloudflare: wrangler secret put <NAMA>).
# Selama kunci kosong, server berjalan dalam MODE SIMULASI (tanpa transaksi sungguhan).
# Pengaturan [vars] di bawah juga dibaca oleh server VPS (server/node.mjs).
