<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Jean Shop</title>
  <meta name="theme-color" content="#070b14" />
  <link rel="icon" type="image/png" href="assets/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">
  <header class="header">
    <div class="container header-top">
      <a href="admin" class="logo" aria-label="Admin Jean Shop">
        <img class="logo-icon" src="assets/logo-icon.png" alt="" />
        <span class="logo-text"><span class="logo-main">JEAN SHOP</span><span class="logo-sub">ADMIN</span></span>
      </a>
      <div class="adm-head-actions">
        <a class="btn-primary sm ghost" href="./" target="_blank" rel="noopener">Lihat toko</a>
        <button class="btn-primary sm ghost" id="logoutBtn" hidden>Keluar</button>
      </div>
    </div>
  </header>

  <main class="container adm-main">
    <!-- Login -->
    <section id="loginView" class="adm-login" hidden>
      <form class="panel" id="loginForm">
        <h1>Masuk Admin</h1>
        <p class="hint">Halaman ini hanya untuk pemilik toko.</p>
        <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required /></label>
        <button class="btn-primary block" type="submit">Masuk</button>
        <p class="adm-error" id="loginError" hidden></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashView" hidden>
      <div class="adm-warn" id="warnBar" hidden></div>

      <div class="adm-stats" id="stats"></div>

      <div class="panel adm-filters">
        <div class="adm-tabs" id="statusTabs" role="tablist"></div>
        <input type="search" id="searchInput" placeholder="Cari invoice, ID tujuan, no. WA, produk…" autocomplete="off" />
      </div>

      <div class="adm-list" id="orders"></div>
      <div class="adm-pager" id="pager"></div>
    </section>

    <p class="adm-error" id="serverError" hidden></p>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
